server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # сам сервер не регистрируется в себе
    fetch-registry: false         # и не тянет чужой реестр
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}